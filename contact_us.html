<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link rel="stylesheet" href="css/style.css" />

</head>

<body>
    <h1>Contact Us</h1>
    <p>If you have any questions or would like to get in touch with us, please fill out the form below:</p>
    <form action="confirmation.html">
        <label for="name">Name: *</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email: *</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="phone">Phone: </label><br>
        <input type="tel" id="phone" name="phone"><br><br>

        <label for="inquiry">State your inquiry *</label> <br>
        <textarea name="inquiry" rows="20" cols="50" required></textarea><br><br>

        <input type="submit" value="Submit">
    </form>
</body>

</html>
